<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Easy Notes</title>
    <meta name="description" content="Keep your notes and documents organised in folders." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Easy Notes" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem("easy_notes_theme");
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app once it starts. Shown only if it can't start at all. -->
      <div id="boot" style="display:none;max-width:22rem;margin:30vh auto 0;padding:0 1.5rem;text-align:center;font-family:system-ui,sans-serif;color:#475569">
        <p style="font-weight:600;color:#0f172a">Easy Notes couldn't start</p>
        <p style="font-size:14px;line-height:1.5">Please reload the page. If it still doesn't open, update your browser or try Chrome.</p>
        <button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:600">Reload</button>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (boot) boot.style.display = "block";
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
